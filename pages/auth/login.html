<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to FreshHire as a student, recruiter, or admin.">
  <title>Log in · FreshHire</title>
  <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">

  <script type="module" src="../../assets/js/pages/auth/login.js"></script>
</head>
<body class="auth-body">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="auth-header">
    <div class="container auth-header__inner">
      <a class="brand" href="../../index.html">
        <img class="brand__logo" src="../../assets/images/logo.svg" alt="FreshHire home" width="150" height="32">
      </a>
      <a class="btn btn--ghost btn--sm" href="../../index.html" data-icon-before="arrowLeft">Back to home</a>
    </div>
  </header>

  <main id="main-content" class="auth-page" tabindex="-1">
    <section class="card auth-card" aria-labelledby="login-title">
      <header class="auth-card__header">
        <h1 class="auth-card__title" id="login-title">Welcome back</h1>
        <p class="auth-card__subtitle">Log in to continue to FreshHire.</p>
      </header>

      <!-- Form-level errors (credentials, blocked account, data load problems) -->
      <div class="alert alert--danger" role="alert" tabindex="-1" data-form-alert hidden></div>

      <form class="form" data-login-form novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-control" id="login-email" name="email" type="email"
            autocomplete="username" inputmode="email" placeholder="you@example.com" required
            aria-describedby="login-email-error">
          <p class="form-error" id="login-email-error" data-error-for="email" hidden></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-group">
            <input class="form-control" id="login-password" name="password" type="password"
              autocomplete="current-password" required aria-describedby="login-password-error">
            <button class="icon-btn input-group__action" type="button" data-action="toggle-password"
              aria-controls="login-password" aria-pressed="false" aria-label="Show password"></button>
          </div>
          <p class="form-error" id="login-password-error" data-error-for="password" hidden></p>
        </div>

        <button class="btn btn--primary btn--lg btn--block" type="submit" data-submit>Log in</button>
      </form>

      <p class="auth-card__switch">
        New to FreshHire?
        <a class="btn btn--ghost btn--sm" href="register.html">Create an account</a>
      </p>

      <section class="demo-accounts" aria-labelledby="demo-title">
        <h2 class="demo-accounts__title" id="demo-title">Demo accounts</h2>
        <p class="demo-accounts__hint">Choose one to fill in the form, then select Log in.</p>
        <ul class="demo-accounts__list" role="list" data-demo-accounts></ul>
      </section>
    </section>
  </main>

  <div data-mount="footer"></div>
</body>
</html>
