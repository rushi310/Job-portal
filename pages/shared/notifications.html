<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your FreshHire notifications.">
  <title>Notifications · FreshHire</title>
  <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">

  <script type="module" src="../../assets/js/pages/shared/notifications.js"></script>
</head>
<body>
  <!-- Hidden until the page guard confirms a logged-in user of any role (assets/js/components/app-shell.js) -->
  <div class="app-shell" data-app-shell hidden>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-mount="navbar"></div>

    <div class="app-body">
      <div data-mount="sidebar"></div>

      <main class="app-main" id="main-content" tabindex="-1">
        <header class="page-header">
          <div>
            <h1>Notifications</h1>
            <p class="page-header__subtitle">Updates about your account, jobs and applications.</p>
          </div>
          <button class="btn btn--outline" type="button" data-mark-all>Mark all as read</button>
        </header>

        <p class="list-count" data-notifications-count role="status" aria-live="polite" tabindex="-1"></p>
        <div class="notification-groups" data-notifications-list></div>
      </main>
    </div>

    <div data-mount="footer"></div>
  </div>

  <noscript>
    <p class="alert alert--warning">FreshHire needs JavaScript enabled to work.</p>
  </noscript>
</body>
</html>
