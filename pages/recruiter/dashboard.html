<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FreshHire Recruiter dashboard.">
  <title>Recruiter Dashboard · FreshHire</title>
  <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/pages/recruiter.css">

  <script type="module" src="../../assets/js/pages/recruiter/dashboard.js"></script>
</head>
<body>
  <!-- Hidden until the page guard confirms a logged-in recruiter (assets/js/components/app-shell.js) -->
  <div class="app-shell" data-app-shell hidden>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-mount="navbar"></div>

    <div class="app-body">
      <div data-mount="sidebar"></div>

      <main class="app-main" id="main-content" tabindex="-1">
        <header class="page-header">
          <div>
            <h1>Recruiter Dashboard</h1>
            <p class="page-header__subtitle">Welcome back, <span data-user-name></span>!</p>
          </div>
        </header>

        <div data-approval-banner></div>

        <!-- Stat cards (PROJECT_SPEC §3.3): active jobs, total applicants, shortlisted, pending approval -->
        <section class="dashboard-section" aria-labelledby="stats-title">
          <h2 class="visually-hidden" id="stats-title">Your summary</h2>
          <ul class="grid grid--4 dashboard-stats" role="list" data-stats></ul>
        </section>

        <div class="dashboard-grid">
          <div class="dashboard-grid__main">
            <section class="card dashboard-section" aria-labelledby="applicants-title">
              <div class="card__header">
                <h2 class="card__title" id="applicants-title">Recent applicants</h2>
              </div>
              <div data-recent-applicants></div>
            </section>
          </div>

          <div class="dashboard-grid__side">
            <section class="card dashboard-section" aria-labelledby="actions-title">
              <h2 class="card__title mb-4" id="actions-title">Quick actions</h2>
              <ul class="quick-actions quick-actions--stacked" role="list" data-quick-actions></ul>
            </section>
          </div>
        </div>

        <!-- Job-level analytics (PROJECT_SPEC §3.3, Phase 11): only this recruiter's own jobs and applicants -->
        <div class="analytics-grid">
          <section class="card dashboard-section" aria-labelledby="per-job-title">
            <div class="card__header">
              <h2 class="card__title" id="per-job-title">Applicants per job</h2>
            </div>
            <p class="chart-summary" data-per-job-summary></p>
            <div data-per-job-chart></div>
          </section>

          <section class="card dashboard-section" aria-labelledby="funnel-title">
            <div class="card__header">
              <h2 class="card__title" id="funnel-title">Application funnel</h2>
            </div>
            <p class="chart-summary" data-funnel-summary></p>
            <div data-funnel-chart></div>
          </section>
        </div>
      </main>
    </div>

    <div data-mount="footer"></div>
  </div>

  <noscript>
    <p class="alert alert--warning">FreshHire needs JavaScript enabled to work.</p>
  </noscript>
</body>
</html>
