# Render Blueprint — FreshHire API (see DEPLOYMENT.md).
# No secret is written here. Values marked "sync: false" are typed into the Render dashboard when
# the Blueprint is created; JWT_SECRET is generated by Render.
#
# The service runs from the repository root (no rootDir) and steps into server/ in its commands,
# because the admin "reset demo data" feature reads the seed files in /data at the repository root.

services:
  - type: web
    name: freshhire-api
    runtime: node
    plan: free
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string (contains the database password).
      - key: MONGODB_URI
        sync: false
      # Signs login tokens. Render creates a random value; it never appears in the repository.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      # The deployed frontend origin, e.g. https://your-site-name.netlify.app (no trailing slash).
      - key: FRONTEND_URL
        sync: false
      # Deadlines end at midnight India time (minutes ahead of UTC).
      - key: APP_TIMEZONE_OFFSET_MINUTES
        value: "330"
      # Keep "false" unless you really want the admin button that erases the database.
      - key: ALLOW_DEMO_RESET
        value: "false"
